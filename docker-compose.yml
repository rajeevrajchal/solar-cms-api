version: '3.5'
services:
  db:
    image: postgres:latest
    container_name: solar-cms-db
    environment:
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solar-cms
    environment:
      - PORT=${PORT}
    ports:
      - '8000:8000'
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data:
